<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Encrypted Messenger</title>
    <link rel="stylesheet" href="/style.css">
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}
.form-box {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
}
.logo {
    text-align: center;
    margin-bottom: 30px;
}
.lock-icon {
    font-size: 48px;
    margin-bottom: 10px;
}
.form-box h1 {
    font-size: 24px;
    color: #fff;
    margin-bottom: 8px;
}
.subtitle {
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
}
.tabs {
    display: flex;
    margin-bottom: 30px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.2);
}
.tab-btn {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    font-size: 16px;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.6);
    transition: all 0.3s;
}
.tab-btn.active {
    color: #fff;
    border-bottom: 2px solid #667eea;
    margin-bottom: -2px;
}
.tab-content {
    display: none;
}
.tab-content.active {
    display: block;
}
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 14px;
}
input::placeholder {
    color: rgba(255, 255, 255, 0.5);
}
input:focus {
    outline: none;
    border-color: #667eea;
}
button {
    width: 100%;
    padding: 12px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s;
}
button:hover {
    background: #5a67d8;
}
.error {
    color: #ff6b6b;
    font-size: 14px;
    margin-top: 10px;
    text-align: center;
}
</style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <div class="logo">
                <div class="lock-icon">🔒</div>
                <h1>Encrypted Messenger</h1>
                <p class="subtitle">Сквозное шифрование</p>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>
            
            <div id="login" class="tab-content active">
                <input type="text" id="login-username" placeholder="Имя пользователя">
                <input type="password" id="login-password" placeholder="Пароль">
                <button onclick="login()">Войти</button>
                <div id="login-error" class="error"></div>
            </div>
            
            <div id="register" class="tab-content">
                <input type="text" id="reg-username" placeholder="Имя пользователя">
                <input type="password" id="reg-password" placeholder="Пароль">
                <button onclick="register()">Зарегистрироваться</button>
                <div id="reg-error" class="error"></div>
            </div>
        </div>
    </div>
    
    <script>
        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            
            if (!username || !password) {
                errorDiv.textContent = 'Заполните все поля';
                return;
            }
            
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const data = await res.json();
            
            if (data.success) {
                localStorage.setItem('username', username);
                localStorage.setItem('password', password);
                localStorage.setItem('userId', data.userId);
                window.location.href = '/chat.html';
            } else {
                errorDiv.textContent = data.error;
            }
        }
        
        async function register() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const errorDiv = document.getElementById('reg-error');
            
            if (!username || !password) {
                errorDiv.textContent = 'Заполните все поля';
                return;
            }
            
            if (password.length < 4) {
                errorDiv.textContent = 'Пароль должен быть не менее 4 символов';
                return;
            }
            
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const data = await res.json();
            
            if (data.success) {
                alert(`Регистрация успешна!\nВаш ID: ${data.userId}\nСохраните его для связи с друзьями`);
                document.getElementById('reg-username').value = '';
                document.getElementById('reg-password').value = '';
                document.querySelector('[data-tab="login"]').click();
            } else {
                errorDiv.textContent = data.error;
            }
        }
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(tab).classList.add('active');
            });
        });
    </script>
</body>
</html>
